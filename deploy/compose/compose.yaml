name: grandstream-provisioning

services:
  provisioning:
    image: grandstream-provisioning:local
    build:
      context: ../..
      dockerfile: container/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: ../../config
        target: /config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../roots
        target: /roots
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /srv/provision:mode=0755,size=64m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
